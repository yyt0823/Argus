# Argus configuration.
# Copy this file to argus.toml (git-ignored) and fill in your own handles.

# Which Apple ID the Mac's Messages app is signed into.
#   "contact" (recommended): a dedicated Apple ID for Argus. You text the bot from your iPhone
#             and Argus replies in that conversation. See "Dedicated Apple ID" in the README.
#   "self"    (default): your own Apple ID. You text yourself; Argus answers in the self-chat.
#             Every message appears twice on the iPhone (sent + received copy).
mode = "self"

# Required: iMessage handles (phone number in E.164 form and/or Apple ID email).
#   mode = "contact": YOUR handles, i.e. what your iPhone sends from when you text the bot
#                     (list both if your iPhone may send from either). Argus only talks to these.
#                     Replies go to whichever of them wrote last.
#   mode = "self":    your own handles; Argus answers messages you send to yourself.
self_handles = ["+15550000000"]
# self_handles = ["+15550000000", "someone@example.com"]

# --- Optional settings (defaults shown) ---

# Path to the Messages database.
# chat_db = "~/Library/Messages/chat.db"

# Seconds between chat.db polls.
# poll_interval = 1.0

# Local hour at which the daily session rolls over and backups are taken.
# rollover_hour = 4

# Seconds before Argus sends a "still working" notice.
# slow_notice_seconds = 15.0

# Number of daily backups to keep.
# backup_keep = 30

# Claude model to use; omit to use the Claude Code default.
# model = "sonnet"

# --- Email (optional; reads the macOS Mail app's local data, read-only) ---
# All keys optional; defaults shown. Add your accounts to Mail first (see "Email" in the README).
# [mail]
# enabled = true                  # false: no mail tools, alerts or briefing
# briefing_time = "08:00"         # daily email briefing (sent on start if missed today)
# quiet_start = "23:00"           # no immediate alerts from quiet_start to quiet_end;
# quiet_end = "08:00"             #   those emails go into the next briefing
# check_interval_minutes = 5      # how often new mail is checked
# triage_model = "haiku"          # model for the one-shot, tool-less importance check per email
