# Argus configuration.
# Copy this file to argus.toml (git-ignored) and fill in your own handles.

# Which Apple ID the Mac's Messages app is signed into.
#   "contact" (recommended): a dedicated Apple ID for Argus. You text the bot from your iPhone
#             and Argus replies in that conversation. See "Dedicated Apple ID" in the README.
#   "self"    (default): your own Apple ID. You text yourself; Argus answers in the self-chat.
#             Every message appears twice on the iPhone (sent + received copy).
mode = "self"

# Required: iMessage handles (phone number in E.164 form and/or Apple ID email).
#   mode = "contact": YOUR handles, i.e. what your iPhone sends from when you text the bot
#                     (list both if your iPhone may send from either). Argus only talks to these.
#                     Replies go to whichever of them wrote last.
#   mode = "self":    your own handles; Argus answers messages you send to yourself.
self_handles = ["+15550000000"]
# self_handles = ["+15550000000", "someone@example.com"]

# --- Optional settings (defaults shown) ---

# Path to the Messages database.
# chat_db = "~/Library/Messages/chat.db"

# Seconds between chat.db polls.
# poll_interval = 1.0

# Local hour at which the daily session rolls over and backups are taken.
# rollover_hour = 4

# Seconds before Argus sends a "still working" notice.
# slow_notice_seconds = 15.0

# Number of daily backups to keep.
# backup_keep = 30

# Claude model to use; omit to use the Claude Code default.
# model = "sonnet"

# --- Email (optional; reads the macOS Mail app's local data, read-only) ---
# All keys optional; defaults shown. Add your accounts to Mail first (see "Email" in the README).
# [mail]
# enabled = true                  # false: no mail tools, alerts or briefing
# briefing_time = "08:00"         # daily email briefing (sent on start if missed today)
# quiet_start = "23:00"           # no immediate alerts from quiet_start to quiet_end;
# quiet_end = "08:00"             #   those emails go into the next briefing
# check_interval_minutes = 5      # how often new mail is checked
# triage_model = "haiku"          # model for the one-shot, tool-less importance check per email

# --- Fitness and food log (optional) ---
# Food / weight / workout logging through chat, with daily budgets. Put your own numbers in argus.toml.
# All keys optional; generic defaults shown.
# [fitness]
# enabled = true                     # false: no fitness tools, no briefing line, no import
# plan_path = "data/fitness/CLAUDE.md"   # your plan (Markdown), read by the fitness_plan tool
# training_days = ["mon", "wed", "fri"]  # used when no workout is logged for a day
# training_kcal = 2000               # daily kcal budget on training days
# rest_kcal = 1800                   # daily kcal budget on rest days
# min_kcal = 1200                    # flag days below this
# protein_g = [100, 150]             # [low, high] grams per day
# carbs_g = [150, 250]
# fat_g = [50, 70]
# added_sugar_g_max = 25
# sodium_mg_max = 2300

# --- Internships (optional) ---
# Daily internship search and automatic applications through jobagent (see "Internships" in the
# README). All keys optional; defaults shown.
# [jobs]
# enabled = true                     # false: no searches, applications, tools or briefing section
# scout_time = "07:30"               # daily search (run on start if missed today)
# auto_apply = false                 # true: apply automatically to fit >= min_fit_apply on known ATS sites
# min_fit_apply = 4                  # auto-apply to postings with fit >= this (1-5)
# daily_apply_limit = 8              # max automatic submissions per day
# apply_window = ["08:30", "22:00"]  # only apply between these times
# internships_dir = "data/about_me/internships"
# resume_path = "data/about_me/yantian_yin_cv.pdf"
# cli_path = "/opt/homebrew/bin/claude"   # unused since applications moved to jobagent
# apply_budget_usd = 2.0            # unused since applications moved to jobagent
# jobagent_dir = "~/Desktop/side_project/job_finding_agent"   # the jobagent checkout that applies
# jobagent_profile = "config/profile.yaml"   # relative to jobagent_dir
# jobagent_model = "..."             # unset: jobagent's default model
# notify_only_companies = ["Google", "Amazon", "Meta", "Apple", "Microsoft", "Nvidia", "OpenAI"]   # never auto-apply; notify only
# human_timeout_minutes = 30         # how long jobagent waits for your answer to a question
# summary_mail_wait_minutes = 20
